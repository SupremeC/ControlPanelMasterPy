<!doctype html>
<html lang="sv">
<head>
	<meta charset="utf-8" />
	<title>Kommando</title>
	<link rel="stylesheet" href="pi.css" />
</head>
<body>
	<div class="row">
		<label for="command">Kommando</label>
		<select id="command" data-setting="command">
			<option value="">Välj…</option>
			<option value="all_off">Släck allt</option>
			<option value="bedlamp">Sänglampan (växla)</option>
			<option value="stop">Stoppa ljud</option>
			<option value="mute">Tyst / ljud på</option>
		</select>
	</div>
	<div class="note">"Släck allt" släcker lampor, slingor och uttag utan att fråga.</div>
	<hr />
	<div class="row">
		<label for="host">Panelens adress</label>
		<input id="host" type="text" placeholder="http://192.168.150.33:8080" />
	</div>
	<script src="pi.js"></script>
</body>
</html>
